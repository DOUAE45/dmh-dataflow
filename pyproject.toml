[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dmh-dataflow"
version = "0.1.0"
description = "DMH DataFlow — Intelligent DataOps Platform (PFA)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Douae" }, { name = "Meryem" }, { name = "Hala" }]

# Versions alignées sur le fichier de contraintes d'Apache Airflow 3.3.2 (Python 3.12)
# pour que le package `dmh` s'installe sans conflit dans l'image Airflow.
dependencies = [
    "pandas==3.0.5",
    "SQLAlchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
app = [
    "streamlit==1.66.1",
    "plotly==7.1.0",
]
metrics = [
    "prometheus-client==0.26.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests nécessitant PostgreSQL (docker compose up)",
]
# Par défaut, seuls les tests unitaires tournent ; `pytest -m integration` pour le reste.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
